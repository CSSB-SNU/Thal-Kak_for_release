# ESMFold2 inference config (consumed by Structure/script/esmfold2/run_esmfold2.py).
# Argument names match esm.ESMFold2InputBuilder.fold() / ESMFold2Model.forward().

# Model variant: "biohub/ESMFold2" (full, supports MSA) or "biohub/ESMFold2-Fast"
model_variant: "biohub/ESMFold2"

# MSA is only consumed by the full variant. Set false (or run -Fast) to skip
# the merged paired+unpaired a3m construction.
use_msa: true

# Trunk refinement iterations.
num_loops: 3

# Diffusion sampling steps per sample.
num_sampling_steps: 50

# Number of samples produced per seed (each becomes one PDB output).
num_diffusion_samples: 5

# MSA inference-time diversity (full variant only).
# msa_max_depth: null disables per-loop row subsampling (reproduces the
#   pre-diversity behavior); set an int (e.g. 1024) to enable it.
# msa_column_mask_rate: 0.0 disables column masking; e.g. 0.1 to enable.
msa_max_depth: null
msa_column_mask_rate: 0.0

# Optional accelerators.
kernel_backend: cuequivariance  # "cuequivariance" | "fused" | null -- trunk kernel path (speed)
cueq_msa: true         # cueq on the MSA encoder too (needs kernel_backend: cuequivariance)
tf32: true             # TF32 on fp32 matmuls -- matches the ESMFold2 paper's inference config
chunk_size: null       # int|null -- tile L^2 transients (memory, for large complexes); can cost speed
offload_lm: true       # park ESM-C on CPU during folding (memory; no result change)
